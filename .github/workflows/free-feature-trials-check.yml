name: Verify timed free features and preserved subscription trials
on:
  push:
    branches:
      - feature/limited-free-feature-push-trial-ledger
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/free-feature-trials.test.mjs
