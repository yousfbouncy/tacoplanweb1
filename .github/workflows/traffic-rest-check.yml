name: Verify traffic rest history
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/empresas/dashboard/route.ts'
      - 'components/enterprise-workspace.tsx'
      - 'lib/tp-traffic-rest.ts'
      - 'tests/tp-traffic-rest.test.ts'
      - '.github/workflows/traffic-rest-check.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
